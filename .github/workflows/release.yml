name: Release

# Push a tag like v0.2.0 (it must match package.json). Publishes a GitHub
# release with the notes from CHANGELOG.md. The container image for the same
# version is built from the Zorofin monorepo (tag companion-v<version>) and
# published as ghcr.io/zoraz01/zorofin-companion:<version> and :latest.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json $declared"
            exit 1
          fi
      - name: Test
        run: node --test
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::No CHANGELOG.md section for ${GITHUB_REF_NAME#v}"; exit 1; }
          printf '\nImage: `ghcr.io/zoraz01/zorofin-companion:%s` (also `:latest`).\n' "${GITHUB_REF_NAME#v}" >> notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Zorofin companion ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
