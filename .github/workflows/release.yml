name: Release

# Push a tag like v0.2.0 (it must match package.json), or run this workflow by
# hand on main to release package.json's version (it creates the tag). Publishes a GitHub
# release with the notes from CHANGELOG.md. The container image for the same
# version is built from the Zorofin monorepo (tag companion-v<version>) and
# published as ghcr.io/zoraz01/zorofin-companion:<version> and :latest.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        id: version
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v$declared"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "${tag#v}" != "$declared" ]; then
            echo "::error::Tag $tag does not match package.json $declared"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Test
        run: node --test
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::No CHANGELOG.md section for ${TAG#v}"; exit 1; }
          printf '\nImage: `ghcr.io/zoraz01/zorofin-companion:%s` (also `:latest`).\n' "${TAG#v}" >> notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --title "Zorofin companion ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA"
